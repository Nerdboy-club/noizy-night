# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-11-07

project:
  name: "Operation: Silent Night"
  root: "unity/SilentNight"

engine:
  name: "Unity"
  version: "6000.6.8f1"
  language: "C#"
  rendering: "URP"
  physics: "PhysX"
  path: "C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe"

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-dots-specialist", "unity-addressables-specialist"]

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from docs/engine-reference/unity/; confirm before relying on it
  signals: "PascalCase On<Event>"
  files: PascalCase
  scenes: PascalCase

commands:
  build: '"C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe" -batchmode -quit -projectPath unity/SilentNight -buildTarget StandaloneWindows64 -buildWindows64Player Builds/Win64/SilentNight.exe'
  test: '"C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe" -batchmode -nographics -runTests -projectPath unity/SilentNight -testPlatform PlayMode -testResults test-results/playmode.xml'
  run: "Builds/Win64/SilentNight.exe -screen-width 1280 -screen-height 720 -screen-fullscreen 0"
  smoke: '"C:/Program Files/Unity/Hub/Editor/6000.6.8f1/Editor/Unity.exe" -batchmode -nographics -quit -projectPath unity/SilentNight -logFile -'
